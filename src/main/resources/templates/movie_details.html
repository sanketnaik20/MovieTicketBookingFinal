<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 16px;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"] {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007BFF;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 th:text="${movie.title}"></h1>
    <p th:text="${movie.description}"></p>
    <p>Show Time: <span th:text="${movie.currentShowTime}"></span></p>
    <p>Available Seats: <span th:text="${movie.availableSeats}"></span></p>
    <p>Ticket Price: <span th:text="${movie.ticketPrice}"></span></p>

    <form action="#" th:action="@{/movies/book/{id}(id=${movie.id})}" method="post">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="text" name="phone" placeholder="Your Phone" required>
        <input type="number" name="seats" placeholder="Number of Seats" required min="1" max="200">
        <button type="submit">Book Tickets</button>
    </form>
    
    <a href="/movies">Back to Movies</a>
</body>
</html>
